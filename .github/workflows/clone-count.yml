name: clone-count

# Adds this repo's daily clone counts to a running total kept in a public gist.
# The gist file <repo>-clones.json feeds the clones badge in README.md.
# Secrets: TRAFFIC_TOKEN (fine-grained, Administration: read, this repo),
#          GIST_TOKEN (classic, gist scope only), GIST_ID (id of the gist).

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  count-clones:
    runs-on: ubuntu-latest
    steps:
      - name: Merge new clone counts into the gist
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          REPO: ${{ github.repository }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          days_file="${REPO_NAME}-days.json"
          badge_file="${REPO_NAME}-clones.json"

          # GitHub keeps only the last 14 days of clone counts.
          recent_days=$(GH_TOKEN="$TRAFFIC_TOKEN" gh api "repos/${REPO}/traffic/clones" \
            | jq '[.clones[] | {key: .timestamp[0:10], value: .count}] | from_entries')

          # Days already stored in the gist (empty on the first run).
          stored_days=$(GH_TOKEN="$GIST_TOKEN" gh api "gists/${GIST_ID}" \
            | jq -c --arg f "$days_file" '.files[$f].content // "{}" | fromjson')

          # Merge by date: a day seen again is overwritten, never added twice.
          all_days=$(jq -n --argjson old "$stored_days" --argjson new "$recent_days" '$old + $new')
          total=$(jq 'add // 0' <<< "$all_days")

          badge=$(jq -n --arg total "$total" \
            '{schemaVersion: 1, label: "clones", message: $total, color: "blue"}')

          jq -n --arg df "$days_file" --arg bf "$badge_file" \
            --arg days "$all_days" --arg badge "$badge" \
            '{files: {($df): {content: $days}, ($bf): {content: $badge}}}' \
            | GH_TOKEN="$GIST_TOKEN" gh api --method PATCH "gists/${GIST_ID}" --input - > /dev/null
          echo "Total clones recorded: ${total}"
